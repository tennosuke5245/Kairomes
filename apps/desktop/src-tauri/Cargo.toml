[package]
name = "kairomes-desktop"
version = "0.1.1"
description = "Kairomes local companion desktop shell"
authors = ["TeNNoSuKe"]
license = "MIT"
edition = "2021"
rust-version = "1.89"

[lib]
name = "kairomes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-shell = "2.3.6"
tauri-plugin-single-instance = "2.4.5"
tokio = { version = "1", features = ["time"] }
which = "8.0.6"
