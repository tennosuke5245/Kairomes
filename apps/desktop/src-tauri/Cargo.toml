[package]
name = "kairomes-desktop"
version = "0.3.0"
description = "Kairomes local companion desktop shell"
authors = ["TeNNoSuKe"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "kairomes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-shell = "2.4.0"
tauri-plugin-single-instance = "2.5.2"
tokio = { version = "1", features = ["sync", "time"] }
which = "8.0.6"
